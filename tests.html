<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Regression Tests</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0e1a;
      color: #c8daf0;
      font-family: 'Courier New', monospace;
      padding: 2rem;
    }
    h1 {
      color: rgba(60,140,255,0.9);
      font-size: 1.4rem;
      letter-spacing: 0.15em;
      border-bottom: 1px solid rgba(60,140,255,0.3);
      padding-bottom: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .suite { margin-bottom: 2rem; }
    .suite-title {
      color: rgba(60,140,255,0.7);
      font-size: 0.9rem;
      letter-spacing: 0.1em;
      margin-bottom: 0.5rem;
    }
    .test {
      padding: 0.4rem 0.8rem;
      margin: 0.25rem 0;
      border-left: 3px solid transparent;
      font-size: 0.85rem;
    }
    .test.pass {
      border-left-color: #3cff6e;
      color: #a0f0b0;
    }
    .test.fail {
      border-left-color: #ff4050;
      color: #ffa0a0;
      background: rgba(255,64,80,0.08);
    }
    .badge {
      display: inline-block;
      width: 3.2em;
      text-align: center;
      font-weight: bold;
      margin-right: 0.5rem;
    }
    .pass .badge { color: #3cff6e; }
    .fail .badge { color: #ff4050; }
    .detail {
      color: rgba(160,180,210,0.6);
      font-size: 0.75rem;
      margin-left: 4.2em;
    }
    .summary {
      margin-top: 2rem;
      padding: 0.8rem 1rem;
      border: 1px solid rgba(60,140,255,0.3);
      font-size: 0.95rem;
    }
    .summary.all-pass { border-color: #3cff6e; color: #a0f0b0; }
    .summary.has-fail { border-color: #ff4050; color: #ffa0a0; }
    #error-box {
      display: none;
      padding: 1rem;
      margin-bottom: 1.5rem;
      border: 1px solid #ff4050;
      color: #ffa0a0;
      background: rgba(255,64,80,0.08);
    }
  </style>
</head>
<body>
  <h1>// REGRESSION TESTS</h1>
  <div id="error-box"></div>
  <div id="results"></div>

  <script>
    const results = [];

    function assert(pass, name, detail) {
      results.push({ pass: !!pass, name, detail });
    }

    function render() {
      const container = document.getElementById('results');
      // Group by suite
      const suites = {};
      for (const r of results) {
        const parts = r.name.split(': ');
        const suite = parts.length > 1 ? parts[0] : 'General';
        const test = parts.length > 1 ? parts.slice(1).join(': ') : parts[0];
        if (!suites[suite]) suites[suite] = [];
        suites[suite].push({ ...r, shortName: test });
      }
      let html = '';
      for (const [suite, tests] of Object.entries(suites)) {
        html += `<div class="suite"><div class="suite-title">${suite}</div>`;
        for (const t of tests) {
          const cls = t.pass ? 'pass' : 'fail';
          const badge = t.pass ? 'PASS' : 'FAIL';
          html += `<div class="test ${cls}"><span class="badge">${badge}</span>${t.shortName}`;
          if (t.detail) html += `<div class="detail">${t.detail}</div>`;
          html += `</div>`;
        }
        html += `</div>`;
      }
      const total = results.length;
      const passed = results.filter(r => r.pass).length;
      const failed = total - passed;
      const cls = failed === 0 ? 'all-pass' : 'has-fail';
      html += `<div class="summary ${cls}">${passed}/${total} passed` +
              (failed > 0 ? ` — ${failed} FAILED` : ' — all clear') + `</div>`;
      container.innerHTML = html;
    }

    function showError(msg) {
      const box = document.getElementById('error-box');
      box.style.display = 'block';
      box.textContent = msg;
    }

    // ---------------------------------------------------------------
    // Extraction helpers
    // ---------------------------------------------------------------

    function extractShaderFloat(src, pattern) {
      const m = src.match(pattern);
      return m ? parseFloat(m[1]) : null;
    }

    function extractShaderInt(src, pattern) {
      const m = src.match(pattern);
      return m ? parseInt(m[1], 10) : null;
    }

    // ---------------------------------------------------------------
    // Main
    // ---------------------------------------------------------------

    async function run() {
      let text;
      try {
        const resp = await fetch('index.html');
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        text = await resp.text();
      } catch (e) {
        showError('Could not fetch index.html: ' + e.message);
        render();
        return;
      }

      // =============================================
      // LANDING PAGE (Sep 2026): a ship in orbit round MILLER, Gargantua always in view.
      // Renderer: js/scene/*.js (ported from demo/). HUD + game menu: index.html + js/hud.js.
      // =============================================
      const SCENE_FILES = ['js/scene/gl.js', 'js/scene/kerr.js', 'js/scene/gargantua.js', 'js/scene/planet.js', 'js/scene/post.js',
                           'js/scene/orbit.js', 'js/scene/flight.js', 'js/scene/combat.js', 'js/scene/ships.js', 'js/hud.js', 'js/scene/main.js'];
      const src = {};
      for (const f of SCENE_FILES) {
        try { const r = await fetch(f); src[f] = r.ok ? await r.text() : null; } catch (e) { src[f] = null; }
        assert(src[f] !== null, 'Extraction: ' + f + ' loaded', src[f] ? src[f].length + ' chars' : 'could not fetch');
      }
      const mainSrc = src['js/scene/main.js'] || '', bhSrc = src['js/scene/gargantua.js'] || '',
            plSrc = src['js/scene/planet.js'] || '', glSrc = src['js/scene/gl.js'] || '',
            orbSrc = src['js/scene/orbit.js'] || '', postSrc = src['js/scene/post.js'] || '', kerrSrc = src['js/scene/kerr.js'] || '';
      const doc = new DOMParser().parseFromString(text, 'text/html');

      // 1. THE MENU. Every game that was reachable from the old planet menu must still be one click away, as a
      //    plain link in the static HTML (so it works with no JavaScript and no WebGL).
      const GAMES = ['minesweeper.html', 'freecell/index.html', 'pong.html', 'erosion/index.html', 'pool/index.html',
        'demo/index.html', 'beatrix_game/index.html', 'Isle%20of%20Wandering/index.html', 'fps/index.html',
        'edmund_game/index.html', 'tower_defense/index.html', 'castle_siege/index.html', 'castle_pov/index.html',
        'cat_invasion/index.html', 'island_world/index.html', 'Turtle%20Race/turtle-racing.html'];
      const links = [...doc.querySelectorAll('#crew a.mission')].map(a => a.getAttribute('href'));
      const missing = GAMES.filter(g => !links.includes(g));
      assert(missing.length === 0, 'Menu: every game is in the crew manifest',
        missing.length ? 'MISSING: ' + missing.join(', ') : links.length + ' links, all ' + GAMES.length + ' games present');
      assert(new Set(links).size === links.length, 'Menu: no duplicate game links', links.length + ' links');
      assert(doc.querySelectorAll('#crew details.crew').length === 5, 'Menu: five crew members (Dad, Beatrix, Edmund, Madeline, Theo)',
        doc.querySelectorAll('#crew details.crew').length + ' found');
      const dead = [];
      for (const g of links) { try { const r = await fetch(g); if (!r.ok) dead.push(g); } catch (e) { dead.push(g); } }
      assert(dead.length === 0, 'Menu: every game link resolves to a file', dead.length ? 'BROKEN: ' + dead.join(', ') : 'all ' + links.length + ' resolve');

      // 2. FILE:// SAFETY. The user opens pages by double-clicking: classic scripts only, and nothing may fetch.
      const tags = [...doc.querySelectorAll('script[src]')].map(s => s.getAttribute('src'));
      assert(![...doc.querySelectorAll('script')].some(s => s.type === 'module'), 'file:// safety: no module scripts', tags.length + ' classic scripts');
      assert(tags.join() === SCENE_FILES.join(), 'file:// safety: scripts load in dependency order', tags.join(' → '));
      const runtime = Object.values(src).filter(Boolean).join('\n');
      assert(!/\bfetch\s*\(|XMLHttpRequest|\bimport\s*\(/.test(runtime), 'file:// safety: page scripts never fetch local files',
        'no fetch / XHR / dynamic import in js/scene/*.js or js/hud.js');

      // 3. LENSING UNITS (the demo's "units trap"): M = 1 everywhere. x'' = -1.5 h^2 x / r^5 is the same law in
      //    r_s = 1 units; mixing it with M = 1 radii offset the photon ring from the shadow.
      assert(!/-1\.5\s*\*\s*h2/.test(bhSrc), 'Lensing: no r_s = 1 (-1.5) force law mixed in', 'none found');
      // Gargantua is a KERR hole (Sep 2026): the bake integrates Kerr null geodesics in Mino time, radially in u = 1/r
      // (in r the far field drifts and lets rays inside the shadow escape) and angularly as a unit vector N on the sphere
      // (theta/phi has an L/sin^2 spike that drew a bead chain along the spin axis). kerr.js is the float64 twin.
      assert(/float\s+fU\s*\(\s*float\s+u\s*\)[^}]*cA\)\*u/.test(bhSrc) && /-\(B2\s*\+\s*A2\*m\*m\)\*N\s*\+\s*A2\*m\*\(vec3\(0\.0,\s*1\.0,\s*0\.0\)\s*-\s*m\*N\)/.test(bhSrc),
        'Lensing: Kerr geodesics in Mino time, u = 1/r and N on the sphere', "FS_KERR_GEOM's fU() and fN()");
      assert(/shadowDist\s*\(/.test(bhSrc) && /float\s+db\s*=\s*nr\s*<\s*0\.0\s*\?\s*shadowDist/.test(bhSrc),
        'Lensing: the shadow is analytic per pixel (radial potential), never a filtered capture flag', "FS_KERR_SHADE main()");
      let K = null;
      try { K = new Function(kerrSrc + '\nreturn KERR;')(); } catch (e) {}
      assert(!!K, 'Kerr maths: js/scene/kerr.js runs standalone (pure, no GL/DOM)', K ? 'KERR loaded' : 'failed to evaluate');
      if (K) {
        const near = (x, y, e) => Math.abs(x - y) <= e, DEG = Math.PI/180, P = [45*Math.cos(4*DEG), 45*Math.sin(4*DEG), 0];
        assert(near(K.horizon(0), 2, 1e-12) && near(K.isco(0), 6, 1e-9) && near(K.photonOrbit(0, 1), 3, 1e-9) && near(K.rIn(0), 4.6, 1e-9),
          'Kerr maths: a = 0 is Schwarzschild (horizon 2, ISCO 6, photon orbit 3, disc edge 4.6 M)', 'M = 1 units');
        assert(near(K.horizon(1), 1, 1e-12) && near(K.isco(1), 1, 1e-6) && near(K.isco(-1), 9, 1e-9) && near(K.photonOrbit(1, -1), 4, 1e-9),
          'Kerr maths: a = 1 limits (horizon 1, ISCO 1 / 9, retrograde photon orbit 4)', 'Bardeen-Press-Teukolsky');
        // shadow radius at a = 0 seen by the ZAMO camera at 45 M: asin(sqrt27/45 * sqrt(1 - 2/45)) = 6.4811 deg
        const c0 = K.camera(P, 0), hole = c0.er.map(x => -x), ax = c0.eth;
        const tilt = t => { const c = Math.cos(t), s = Math.sin(t); return [hole[0]*c + ax[0]*s, hole[1]*c + ax[1]*s, hole[2]*c + ax[2]*s]; };
        let lo = 0.1*DEG, hi = 20*DEG; for (let i = 0; i < 50; i++) { const m = 0.5*(lo + hi); (K.shadowDist(K.constants(c0, tilt(m)), c0) < 0 ? lo = m : hi = m); }
        assert(near(lo, Math.asin(Math.sqrt(27)/45*Math.sqrt(1 - 2/45)), 1e-5), 'Kerr maths: a = 0 shadow radius from 45 M is 6.481°', (lo/DEG).toFixed(4) + '°');
        const c9 = K.camera(P, 0.9), cur = K.criticalCurve(c9, 90);
        let worst = 0; for (const d of cur) worst = Math.max(worst, Math.abs(K.shadowDist(K.constants(c9, d), c9)));
        assert(cur.length > 60 && worst < 1e-6, 'Kerr maths: the critical curve (the HUD lock ring and SHADOW readout) lies on the shader\'s shadow edge at a = 0.9', 'max |edge distance| ' + worst.toExponential(1) + ' M');
        // handedness: the side where photons co-rotate (L > 0, looking toward -e_phi) is the FLAT side and the BLUESHIFTED one
        const t9 = K.trace(c9, (() => { const m = c9.eph.map(x => -x), h = c9.er.map(x => -x), t = 14*DEG, d = [h[0]*Math.cos(t) + m[0]*Math.sin(t), h[1]*Math.cos(t) + m[1]*Math.sin(t) - 0.08, h[2]*Math.cos(t) + m[2]*Math.sin(t)], l = Math.hypot(...d); return d.map(x => x/l); })());
        assert(t9.cross.length && t9.cross[0].g > 1, 'Kerr maths: the approaching (L > 0) side of the disc is blueshifted', t9.cross.length ? 'g = ' + t9.cross[0].g.toFixed(3) : 'no crossing');
        const sAway = K.trace(c9, c9.er);   // straight out: escapes, pointing where it started
        assert(!sAway.captured && Math.abs(sAway.dir[0]*c9.er[0] + sAway.dir[1]*c9.er[1] + sAway.dir[2]*c9.er[2] - 1) < 1e-6, 'Kerr maths: a radial ray outward escapes straight', 'reference tracer sanity');
      }

      // 4. SHADER PARITY WITH THE DEMO. The landing page's shaders are copies of demo/'s so a fix in one can be
      //    mirrored in the other. If you changed one on purpose, change the other too (or document the split here).
      const lit = (s, name) => { const m = s.replace(/\r\n/g, '\n').match(new RegExp('const\\s+' + name + '\\s*=\\s*(?:\\w+\\s*\\+\\s*)?`([\\s\\S]*?)`;')); return m ? m[1] : null; };
      let demoBh = null, demoDeep = null;
      try { demoBh = await (await fetch('demo/js/gargantua.js')).text(); demoDeep = await (await fetch('demo/js/deep.js')).text(); } catch (e) {}
      // (Split, Sep 2026: the landing page's hole spins, so its GEOMETRY pass is its own Kerr FS_KERR_GEOM; the demo keeps
      // the Schwarzschild FS_BH_GEOM. The shading helpers are still shared: FS_BH_SHADE is kept verbatim and the landing page
      // splices its Kerr main() in at program creation.)
      for (const [name, a, b] of [['BH_COMMON', bhSrc, demoBh], ['FS_BH_SHADE', bhSrc, demoBh],
          ['FS_SYS_COMMON', plSrc, demoDeep], ['FS_SYS_BASE', plSrc, demoDeep], ['FS_SYS_SURF', plSrc, demoDeep], ['FS_SYS_ATMO', plSrc, demoDeep]]) {
        const x = lit(a, name), y = b ? lit(b, name) : null;
        assert(x !== null && y !== null && x === y, 'Shader parity: ' + name + ' matches demo/',
          x === null || y === null ? 'could not extract' : x === y ? 'identical' : 'DIFFERS — mirror the change in both copies');
      }

      // 5. DEFERRED PLANET (GPU occupancy): the base pass stays lean. Terrain, clouds and scattering live in their
      //    own scissored passes; inlined into the per-pixel base pass they throttled every pixel (igpu lessons).
      const base = lit(plSrc, 'FS_SYS_BASE') || '';
      assert(base.length > 0 && !/\b(terrain|cloudD|atmo|shadeTerran|shadeRock)\s*\(/.test(base.replace(/^[\s\S]*?void\s+main/, 'void main')),
        'Deferred planet: the base pass calls no material or atmosphere functions', 'FS_SYS_BASE main() only finds hits');

      // 6. THE BAKE. Lensing geometry is baked once at MILLER; the ship's whole orbit is ~1e-4 M across, and
      //    MILLER's own orbit is re-baked in place before the camera can drift far from the bake point.
      assert(/\)\s*\/\s*0\.02\s*;/.test(bhSrc) && /function\s+bhStale/.test(bhSrc) && /bhUpdate\s*\(\s*ORB\.camM/.test(mainSrc),
        'Bake: stale tiles re-baked when the camera drifts 0.02 M or the spin outruns them', 'bhStale() in gargantua.js, bhUpdate() every frame from main.js');
      assert(!/bhUpdate[^\n]*rsSettle/.test(mainSrc) && !/bhBakeStep\(\s*\d+\s*\)\s*;\s*rsSettle/.test(mainSrc),
        'Render scale: the per-frame bake scheduler does not hold rsSettle', 'a steady ~1 ms bake load must not freeze the controller');
      const altMax = extractShaderFloat(orbSrc, /ALT_MAX\s*:\s*([\d.e]+)/), mKm = extractShaderFloat(bhSrc, /M_KM\s*:\s*([\d.e]+)/),
            ceil = extractShaderFloat(src['js/scene/flight.js'] || '', /CEIL\s*:\s*([\d.e]+)/);
      assert(altMax !== null && mKm !== null && ceil !== null && Math.max(altMax + 6.7e6, ceil) < 0.02*mKm*1e3*0.1,
        'Bake: the whole flight envelope stays well inside the re-bake tolerance',
        'station orbit ≤ ' + ((altMax + 6.7e6)/1e3).toFixed(0) + ' km, helm ceiling ' + ((ceil || 0)/1e3).toFixed(0) + ' km vs 0.02 M = ' + (0.02*mKm).toExponential(2) + ' km');

      // 7. GARGANTUA ALWAYS IN VIEW: the orbit tilt is checked against the limb dip at boot, and look-around is clamped.
      assert(/function\s+orbitCheck/.test(orbSrc) && /orbitCheck\s*\(\s*\)/.test(mainSrc), 'Always in view: orbit tilt checked against the limb dip at boot',
        'orbitCheck() throws if Gargantua could set below the limb');
      assert(/L\.yaw\s*=\s*clamp\(\s*L\.yaw/.test(orbSrc) && /L\.pitch\s*=\s*clamp\(\s*L\.pitch/.test(orbSrc), 'Always in view: look-around offsets are clamped',
        'drag cannot turn the hole off screen');

      // 8. ADAPTIVE RENDER SCALE (Aug 2026). Under vsync a frame costs one refresh or two, so a controller with a
      //    millisecond hold band can never hold and pumps the resolution. The controller must settle instead.
      assert(/rsSettle\s*>\s*0/.test(mainSrc) && /rsSettle\s*=\s*\d+/.test(mainSrc),
        'Render scale: controller has a settle window after each change', 'without it the resize cost of a change reads as a reason to change again');
      assert(/rsCeiling/.test(mainSrc), 'Render scale: controller latches a measured ceiling and holds under it',
        'a controller with no memory of what was too heavy keeps re-probing, which pumps');
      const rsMin = extractShaderFloat(mainSrc, /RS_MIN\s*=\s*([\d.]+)/);
      assert(rsMin !== null && rsMin >= 0.35, 'Render scale: floor stays at 0.35 or above', 'RS_MIN = ' + rsMin + ' (sub-floor scaling was rejected)');

      // 8b. THE HELM (flight.js): fly the real orbit.js + flight.js in a sandbox (no GL) and check the promises.
      try {
        const sb = new Function('document', [glSrc, kerrSrc, bhSrc, plSrc, orbSrc, src['js/scene/flight.js'] || '', `
          const SCENE = {state: 'run'};
          const step = (n, dt) => { for (let i = 0; i < n; i++) { HELM.idle = 0; orbitStep(dt); flightStep(dt); } };
          const out = {};
          orbitResize(1600, 900); orbitStep(0); helmEnter();
          // 1. point up and burn 2 s, then let go: the assist must settle a circular orbit
          HELM.f = V.norm(HELM.p); HELM.u = V.norm(V.cross(V.cross(HELM.f, HELM.hdir), HELM.f)); HELM.input.thrust = 1;
          step(120, 1/60); HELM.input.thrust = 0; step(1200, 1/60);
          out.settle = {ecc: ORB.hud.ecc, alt: HELM.alt};
          // 2. dive with boost: the floor holds
          HELM.f = V.mul(V.norm(HELM.p), -1); HELM.u = HELM.hdir; HELM.input.thrust = 1; HELM.input.boost = 1;
          let minAlt = 1e12; for (let i = 0; i < 900; i++) { step(1, 1/60); minAlt = Math.min(minAlt, HELM.alt); }
          out.floor = minAlt; HELM.input.thrust = 0; HELM.input.boost = 0; step(600, 1/60);
          // 3. climb with boost for a long time: the ceiling holds (radial command limited, not the position clamped)
          HELM.f = V.norm(HELM.p); HELM.u = HELM.hdir; HELM.input.thrust = 1; HELM.input.boost = 1;
          let maxR = 0; for (let i = 0; i < 2400; i++) { step(1, 1/30); maxR = Math.max(maxR, V.len(HELM.p)); }
          out.ceil = maxR/HELM.CEIL; HELM.input.thrust = 0; HELM.input.boost = 0;
          // 4. the autopilot flies home without cutting through MILLER, and hands back to STATION
          helmAuto('test'); let minR = 1e12; for (let i = 0; i < 900 && HELM.mode !== 'station'; i++) { step(1, 1/60); minR = Math.min(minR, V.len(HELM.p || [1e12, 0, 0])); }
          out.auto = {mode: HELM.mode, minAlt: minR - ORB.planet.R};
          // 5. assist off, no thrust: energy conserved over one orbit (velocity Verlet)
          helmEnter(); HELM.assist = false; HELM.p = [ORB.planet.R + 8e5, 0, 0]; HELM.v = [0, 0, 1.05*Math.sqrt(ORB.planet.GM/(ORB.planet.R + 8e5))];
          const E = () => V.dot(HELM.v, HELM.v)/2 - ORB.planet.GM/V.len(HELM.p), E0 = E(); step(17000, 1/30);   // a full ~550 s (real) orbit
          out.energy = Math.abs((E() - E0)/E0);
          // 6. purely radial velocity does not break the assist (no horizontal direction to take)
          HELM.assist = true; HELM.v = V.mul(V.norm(HELM.p), 3000); HELM.hdir = null; step(600, 1/60);
          out.radial = {ok: [...HELM.p, ...HELM.v].every(Number.isFinite), ecc: ORB.hud.ecc};
          return out;`].join('\n'));
        const r = sb(document);
        assert(r.settle.ecc < 0.005 && r.settle.alt > 7.2e5, 'Helm: let go and the orbit assist settles a circular orbit', 'e = ' + r.settle.ecc.toFixed(4) + ' at ' + (r.settle.alt/1e3).toFixed(0) + ' km');
        assert(r.floor > 4.9e4, 'Helm: a boosted dive cannot break the 50 km floor', 'lowest ' + (r.floor/1e3).toFixed(1) + ' km');
        assert(r.ceil < 1.05, 'Helm: a long boosted climb stops at the Hill-sphere ceiling', (r.ceil*100).toFixed(1) + '% of the ceiling');
        assert(r.auto.mode === 'station' && r.auto.minAlt > 4e4, 'Helm: the autopilot flies home around MILLER, never through it', r.auto.mode + ', lowest ' + (r.auto.minAlt/1e3).toFixed(0) + ' km');
        assert(r.energy < 1e-6, 'Helm: with the assist off, energy is conserved over an orbit', 'drift ' + r.energy.toExponential(2));
        assert(r.radial.ok && r.radial.ecc < 0.05, 'Helm: a purely radial velocity still settles into orbit', 'e = ' + r.radial.ecc.toFixed(4));
      } catch (e) { assert(false, 'Helm: flight sandbox ran', e.message); }
      assert(/orbitStep\(\s*dt\s*\*/.test(mainSrc) && /flightStep\(\s*dt\s*\)/.test(mainSrc), 'Helm: the launch jump warps the world, not the ship', 'orbitStep(dt*...) but flightStep(dt)');

      // 8c. THE WEAPONS (combat.js): fly orbit.js + flight.js + combat.js in a sandbox (no GL) and check the fight's physics.
      //     Absolute positions move ~1.6 km a frame and a round without gravity sags 2.4 km in 2 s, so these are the traps.
      try {
        const sb = new Function('document', [glSrc, kerrSrc, bhSrc, plSrc, orbSrc, src['js/scene/flight.js'] || '', src['js/scene/combat.js'] || '', `
          const SCENE = {state: 'run'}, TC = ORB.TC;
          const step = (n, dt) => { for (let i = 0; i < n; i++) { HELM.idle = 0; orbitStep(dt); flightStep(dt); combatStep(dt); } };
          const aimAt = t => { const d = V.norm(V.sub(t.p, HELM.p)); HELM.f = d; HELM.u = V.norm(V.sub(V.norm(HELM.p), V.mul(d, V.dot(V.norm(HELM.p), d)))); };
          const out = {};
          orbitResize(1600, 900); orbitStep(0); helmEnter(); step(5, 1/60); COMBAT.cineOK = false;   // (cutaways are the page's business)
          out.armed = cmbArm() && !!HELM.ref && HELM.vcap > 0;
          // 1. the range: a drone that just sits there holds its place beside you (co-rotating), then dies to fire along the nose
          step(60, 1/60);
          const dr = COMBAT.ents.find(e => e.cls === 'drone' && !e.arrive);

        // Test 13: Score on right miss
        w.init(42);
        writeWasm(mem, { ballX: 799, ballVx: 2, ballY: 250, ballVy: 0 });
        w.tick(0);
        s = readWasm(mem);
        assert(s.playerScore === 1,
          'Pong WASM: score on right miss',
          `playerScore=${s.playerScore}`);

        // Test 14: Game ends at 10
        w.init(42);
        writeWasm(mem, { aiScore: 9, ballX: 1, ballVx: -2, ballY: 250, ballVy: 0 });
        w.tick(0);
        s = readWasm(mem);
        assert(s.aiScore === 10 && s.gameRunning === 0,
          'Pong WASM: game ends at 10',
          `aiScore=${s.aiScore} running=${s.gameRunning}`);

        // Test 15: Restart resets state
        w.init(42);
        writeWasm(mem, { aiScore: 9, ballX: 1, ballVx: -2, ballY: 250, ballVy: 0 });
        w.tick(0);
        w.reset();
        s = readWasm(mem);
        assert(s.playerScore === 0 && s.aiScore === 0 && s.gameRunning === 1 &&
               s.playerY === 200 && s.aiY === 200,
          'Pong WASM: restart resets state',
          `scores=${s.playerScore}-${s.aiScore} running=${s.gameRunning} paddles=${s.playerY},${s.aiY}`);

        // Test 16: Paddle collision reverses vx
        w.init(42);
        writeWasm(mem, { ballX: 55, ballY: 230, ballVx: -2, ballVy: 0 });
        w.tick(0);
        s = readWasm(mem);
        assert(s.ballVx > 0,
          'Pong WASM: paddle collision reverses vx',
          `vx=${s.ballVx}`);

        // Test 17: Paddle spin formula
        w.init(42);
        writeWasm(mem, { ballX: 55, ballY: 200, ballVx: -2, ballVy: 0 });
        w.tick(0);
        s = readWasm(mem);
        assert(Math.abs(s.ballVy - (-3)) < 0.001,
          'Pong WASM: paddle spin formula',
          `vy=${s.ballVy} (expected -3, hitPos=0 → (0-0.5)*6=-3)`);
      } else {
        assert(true, 'Pong WASM: skipped (no WASM blob in pong.html)', '');
      }

      // =============================================
      // PONG STRUCTURAL TESTS (WASM version)
      // =============================================

      if (pongHtml && wasmInstance) {
        const hasWasm = /["'][A-Za-z0-9+/]{40,}={0,2}["']/.test(pongHtml);
        assert(hasWasm,
          'Pong structure: WASM binary present',
          hasWasm ? 'base64 blob found' : 'no base64 blob');

        const hasWebGL = /getContext\s*\(\s*['"]webgl/.test(pongHtml);
        const has2D = /getContext\s*\(\s*['"]2d['"]/.test(pongHtml);
        assert(hasWebGL && !has2D,
          'Pong structure: WebGL context (no 2D)',
          `webgl=${hasWebGL} 2d=${has2D}`);

        const hasAccum = /accumulator/i.test(pongHtml);
        assert(hasAccum,
          'Pong structure: fixed timestep accumulator',
          hasAccum ? 'found' : 'not found');

        const has800 = /800/.test(pongHtml);
        const has500 = /500/.test(pongHtml);
        assert(has800 && has500,
          'Pong structure: 800x500 dimensions',
          `800=${has800} 500=${has500}`);

        const hasReadable = /ball\.vx|paddle|aiCenter/.test(pongHtml);
        assert(!hasReadable,
          'Pong structure: no readable game logic in JS',
          hasReadable ? 'found readable game vars' : 'clean');

        const hasDom = /playerScore/.test(pongHtml) && /aiScore/.test(pongHtml) && /gameOver/.test(pongHtml);
        assert(hasDom,
          'Pong structure: DOM elements preserved',
          hasDom ? 'playerScore, aiScore, gameOver found' : 'missing elements');
      }

      // =============================================
      // Done
      // =============================================
      render();
    }

    run();
  </script>
</body>
</html>
