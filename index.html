   <script>
    const canvas = document.getElementById('canvas');
    // antialias:false -- MSAA only smooths polygon edges, but the scene is a single fullscreen
    // ray-marched quad (no geometry edges in menu mode), so MSAA just wastes bandwidth.
    // Anti-aliasing is done by the FXAA resolve pass instead (see the render pipeline below).
    const gl = canvas.getContext('webgl', { antialias: false });
    gl.getExtension('OES_standard_derivatives');

    let baseWidth = window.innerWidth;
    let baseHeight = window.innerHeight;
    let renderScale = 1.0;

    // --- Anti-aliasing pipeline ------------------------------------------------------------
    // The scene is one fullscreen ray-marched quad. The GPU is maxed, so the WASM adaptive
    // resolver renders it at renderScale (often ~0.35). Instead of letting the compositor
    // stretch that low-res image (chunky, shimmery edges -- the "aliasing all over"), we render
    // the raymarch into a low-res offscreen target (lowW x lowH) and then run a full-resolution
    // FXAA pass that anti-aliases WHILE it upscales. Because each raymarch pixel runs ~250 heavy
    // iterations, the full-res FXAA pass (a handful of texture taps, with a flat-region early-out)
    // costs only a few percent on top.
    const SCENE_TEX_UNIT = 2;              // unit 0 = blackbody LUT
    let lowW = 1, lowH = 1;                // low-res raymarch dimensions (offscreen target size)
    let sceneFBO = null, sceneTex = null, sceneTexW = 0, sceneTexH = 0;
    function ensureSceneTarget() {
      if (sceneFBO && sceneTexW === lowW && sceneTexH === lowH) return;  // dims unchanged -> no realloc
      if (!sceneFBO) { sceneFBO = gl.createFramebuffer(); sceneTex = gl.createTexture(); }
      // Bind the scene texture on its own unit so we never clobber the raymarch's unit 0.
      gl.activeTexture(gl.TEXTURE0 + SCENE_TEX_UNIT);
      gl.bindTexture(gl.TEXTURE_2D, sceneTex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, lowW, lowH, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);  // bilinear upscale for free
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.activeTexture(gl.TEXTURE0);        // leave unit 0 active for the raymarch program
      gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFBO);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, sceneTex, 0);
      if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) console.warn('scene FBO incomplete');
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      sceneTexW = lowW; sceneTexH = lowH;
    }

    function resize() {
      baseWidth = window.innerWidth;
      baseHeight = window.innerHeight;
      // Presentation surface is full-resolution; the heavy raymarch runs at renderScale into the
      // offscreen target and the FXAA pass resolves it up to here. (Per-pass viewports are set in
      // the render loop, so resize() doesn't touch gl.viewport.)
      canvas.width = baseWidth;
      canvas.height = baseHeight;
      lowW = Math.max(1, Math.round(baseWidth * renderScale));
      lowH = Math.max(1, Math.round(baseHeight * renderScale));
      ensureSceneTarget();
    }
    window.addEventListener('resize', resize);

    /* ---- Game-selection submenu (clicking a person's planet opens it) ---- */

   <script>
    /* ---- GL setup, buffers, input, render loop ---- */
    let W,dv,wf;

    function cS(g,s,t){const sh=g.createShader(t);g.shaderSource(sh,s);g.compileShader(sh);if(!g.getShaderParameter(sh,g.COMPILE_STATUS)){console.error(g.getShaderInfoLog(sh));g.deleteShader(sh);return null}return sh}
    const vs=cS(gl,vsSource,gl.VERTEX_SHADER),fs=cS(gl,fsSource,gl.FRAGMENT_SHADER),pg=gl.createProgram();
    gl.attachShader(pg,vs);gl.attachShader(pg,fs);gl.linkProgram(pg);
    if(!gl.getProgramParameter(pg,gl.LINK_STATUS))console.error(gl.getProgramInfoLog(pg));
    gl.useProgram(pg);
    const bf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,bf);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
    const aP=gl.getAttribLocation(pg,'a_pos');gl.enableVertexAttribArray(aP);gl.vertexAttribPointer(aP,2,gl.FLOAT,false,0,0);
    const uR=gl.getUniformLocation(pg,'u_resolution'),uT=gl.getUniformLocation(pg,'u_time'),
      uCD=gl.getUniformLocation(pg,'u_camDist'),uSp=gl.getUniformLocation(pg,'u_spin'),
      uCP=gl.getUniformLocation(pg,'u_camPos'),uCF=gl.getUniformLocation(pg,'u_camFwd'),
      uCR=gl.getUniformLocation(pg,'u_camRight'),uCU=gl.getUniformLocation(pg,'u_camUp'),
      uRH=gl.getUniformLocation(pg,'u_rH'),uRI=gl.getUniformLocation(pg,'u_rIsco'),
      uHP=gl.getUniformLocation(pg,'u_hoveredPlanet'),
      // Planets are one vec4[5] array uniform (xyz = centre, w = radius) rather than five
      // scalars, so the shader's march loop can index it with its loop counter.
      uPls=gl.getUniformLocation(pg,'u_planets')||gl.getUniformLocation(pg,'u_planets[0]'),
      uPSlab=gl.getUniformLocation(pg,'u_planetSlab');
    const planetBuf=new Float32Array(5*4);
    // Max |y| any planet surface reaches. Orbits are all in the y = 0 plane, so this is the
    // largest radius; derived from planetData so adding a planet cannot desync the shader.
    gl.uniform1f(uPSlab,Math.max(...planetData.map(p=>p.radius)));

    // Blackbody 1D lookup texture
    const uBB=gl.getUniformLocation(pg,'u_bbTex');
    {
      const N=256,d=new Uint8Array(N*4);
      function ss(e0,e1,x){const t=Math.max(0,Math.min(1,(x-e0)/(e1-e0)));return t*t*(3-2*t)}
      for(let i=0;i<N;i++){
        const t=i/(N-1);
        let r=ss(0,.15,t)*(1-.2*ss(.75,1,t));
        let g=ss(.05,.4,t)*(1-.15*ss(.8,1,t));
        let b=ss(.3,.75,t);
        const w=ss(.15,.4,t)*ss(.65,.35,t);r+=.15*w;g+=.06*w;
        const c=ss(.8,1,t);r+=.05*c;g+=.05*c;b+=.2*c;
        const m=1+.4*ss(.25,.55,t)*ss(.85,.55,t);r*=m;g*=m;b*=m;
        d[i*4]=Math.round(Math.min(r,1)*255);d[i*4+1]=Math.round(Math.min(g,1)*255);
        d[i*4+2]=Math.round(Math.min(b,1)*255);d[i*4+3]=255;
      }
      const tx=gl.createTexture();
      gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tx);
      gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,N,1,0,gl.RGBA,gl.UNSIGNED_BYTE,d);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
      gl.uniform1i(uBB,0);
    }

    /* ---- FXAA post-process program (resolves the low-res scene up to full resolution) ---- */
    const fxVS=cS(gl,fxaaVS,gl.VERTEX_SHADER),fxFS=cS(gl,fxaaFS,gl.FRAGMENT_SHADER),fxaaPg=gl.createProgram();
    gl.attachShader(fxaaPg,fxVS);gl.attachShader(fxaaPg,fxFS);gl.linkProgram(fxaaPg);
    if(!gl.getProgramParameter(fxaaPg,gl.LINK_STATUS))console.error(gl.getProgramInfoLog(fxaaPg));
    const fxaaAPos=gl.getAttribLocation(fxaaPg,'a_pos');
    const uFxTex=gl.getUniformLocation(fxaaPg,'u_tex'),uFxInv=gl.getUniformLocation(fxaaPg,'u_invRes');
    gl.useProgram(fxaaPg);gl.uniform1i(uFxTex,SCENE_TEX_UNIT);

    const bin=Uint8Array.from(atob(WB),c=>c.charCodeAt(0));
    WebAssembly.instantiate(bin,{env:{sin:x=>Math.fround(Math.sin(x)),cos:x=>Math.fround(Math.cos(x)),sqrt:x=>Math.fround(Math.sqrt(x))}}).then(r=>{
      W=r.instance.exports;
      const mem=W.memory;
      dv=new DataView(mem.buffer);
      wf=W.frame;
      for(let i=0;i<5;i++){const p=planetData[i],b=0x100+i*16;dv.setFloat32(b,p.oR,true);dv.setFloat32(b+4,p.ph,true);dv.setFloat32(b+8,p.sp,true);dv.setFloat32(b+12,p.radius,true)}

      // (a duplicate of planet 4) so the WASM never processes a degenerate radius-0 body
      // -- a radius-0 / r=1000 planet can NaN the WASM projection and corrupt shared
      // render state. Slot 5 is never uploaded to the shader, labeled, or hovered (i<5).
      {const p=planetData[4],b=0x100+5*16;dv.setFloat32(b,p.oR,true);dv.setFloat32(b+4,p.ph,true);dv.setFloat32(b+8,p.sp,true);dv.setFloat32(b+12,p.radius,true)}
      dv.setFloat32(0x000,camAz,true);dv.setFloat32(0x004,camEl,true);dv.setFloat32(0x008,camDist,true);
      dv.setFloat32(0x00C,sp,true);dv.setFloat32(0x014,-1,true);dv.setFloat32(0x024,renderScale,true);
      render();
    });

    function wMem(){dv.setFloat32(0x000,camAz,true);dv.setFloat32(0x004,camEl,true);dv.setFloat32(0x008,camDist,true);dv.setFloat32(0x00C,sp,true);dv.setFloat32(0x014,mSX,true);dv.setFloat32(0x018,mSY,true);dv.setFloat32(0x01C,baseWidth,true);dv.setFloat32(0x020,baseHeight,true);dv.setFloat32(0x024,renderScale,true)}

    /* ---- Input handlers ---- */
    let dr=false,lX=0,lY=0,dsX=0,dsY=0,dD=false;
    canvas.addEventListener('mousedown',e=>{
      dr=true;dD=false;dsX=e.clientX;dsY=e.clientY;lX=e.clientX;lY=e.clientY;
    });
    window.addEventListener('mouseup',e=>{
      dr=false;
    });
    window.addEventListener('mousemove',e=>{
      mSX=e.clientX;mSY=e.clientY;hoverDirty=true;
      if(dr){camAz+=(e.clientX-lX)*0.005;camEl=Math.max(-1.5,Math.min(1.5,camEl+(e.clientY-lY)*0.005));lX=e.clientX;lY=e.clientY;const tx=e.clientX-dsX,ty=e.clientY-dsY;if(tx*tx+ty*ty>36)dD=true}
    });
    canvas.addEventListener('click',(e)=>{
      if(!dD&&hP>=0&&hP<planetData.length&&planetData[hP].person)openGameMenu(hP);
    });
    canvas.addEventListener('wheel',e=>{
      e.preventDefault();
      camDist=Math.max(5,Math.min(300,camDist+e.deltaY*0.05));
    },{passive:false});

    let tId=null,tSX=0,tSY=0,dDT=false;
    canvas.addEventListener('touchstart',e=>{if(e.touches.length===1){e.preventDefault();tId=e.touches[0].identifier;lX=e.touches[0].clientX;lY=e.touches[0].clientY;tSX=lX;tSY=lY;dDT=false}},{passive:false});
    canvas.addEventListener('touchmove',e=>{for(let i=0;i<e.changedTouches.length;i++){if(e.changedTouches[i].identifier===tId){e.preventDefault();const dx=e.changedTouches[i].clientX-lX,dy=e.changedTouches[i].clientY-lY;camAz+=dx*0.005;camEl=Math.max(-1.5,Math.min(1.5,camEl+dy*0.005));lX=e.changedTouches[i].clientX;lY=e.changedTouches[i].clientY;const tx=lX-tSX,ty=lY-tSY;if(tx*tx+ty*ty>9)dDT=true}}},{passive:false});
    canvas.addEventListener('touchend',e=>{for(let i=0;i<e.changedTouches.length;i++){if(e.changedTouches[i].identifier===tId){if(!dDT){mSX=e.changedTouches[i].clientX;mSY=e.changedTouches[i].clientY;wMem();wf();hP=dv.getInt32(0x068,true);
      if(hP>=0&&hP<planetData.length&&planetData[hP].person)openGameMenu(hP)}tId=null}}});


    window.addEventListener('keydown',e=>{
      // Game-selection submenu: Escape closes it (takes priority over other keys)
      if(gameMenuOpen){
        if(e.key==='Escape'){closeGameMenu();}
        return;
      }
      if(e.key===']'||e.key==='ArrowRight')sp=Math.min(2,sp+0.02);
      else if(e.key==='['||e.key==='ArrowLeft')sp=Math.max(-2,sp-0.02);
      else if(e.key==='r'||e.key==='R'){camAz=DF.camAz;camEl=DF.camEl;camDist=DF.camDist;sp=DF.sp}
    });

    /* ---- Render loop ---- */
    const hS=document.getElementById('hud-spin'),hD=document.getElementById('hud-dist'),
      hF=document.getElementById('hud-fps'),hSc=document.getElementById('hud-scale');
    let fC=0,lFT=performance.now(),lFrT=performance.now();
    let simTime=0, ftSmooth=16.7;   // ftSmooth: EMA of the frame-time we hand the WASM (0x028).
                                    // The WASM derives the camera basis from this, and a raw
                                    // per-frame delta is noisy -> the whole scene "buzzes" at idle.
                                    // Smoothing it removes the buzz while still tracking real load.

    function render(){
      const now=performance.now(),ft=now-lFrT;lFrT=now;
      simTime+=Math.min(ft*0.001,0.1);
      ftSmooth+=(Math.min(ft,100.0)-ftSmooth)*0.15;   // low-pass the jittery frame-time
      dv.setFloat32(0x028,ftSmooth,true);
      dv.setFloat32(0x010,simTime,true);
      wMem();
      wf();
      const rs=dv.getFloat32(0x06C,true);
      if(Math.abs(rs-renderScale)>0.005){renderScale=rs;resize()}
      {
        // Throttle the 250-step hover trace: recompute on mouse move or every other frame;
        // otherwise reuse the previous hP. Clear hP when the mouse leaves the canvas.
        if(mSX<0)hP=-1;
        else if(hoverDirty||(hoverFrame++%2)===0){
          hoverDirty=false;
          hP=-1;
          const cpx=dv.getFloat32(0x030,true),cpy=dv.getFloat32(0x034,true),cpz=dv.getFloat32(0x038,true);
          const fX=dv.getFloat32(0x03C,true),fY=dv.getFloat32(0x040,true),fZ=dv.getFloat32(0x044,true);
          const rX=dv.getFloat32(0x048,true),rY=dv.getFloat32(0x04C,true),rZ=dv.getFloat32(0x050,true);
          const uX=dv.getFloat32(0x054,true),uY=dv.getFloat32(0x058,true),uZ=dv.getFloat32(0x05C,true);
          const rH=dv.getFloat32(0x060,true);
          const mD=Math.min(baseWidth,baseHeight);
          const nX=(mSX-baseWidth*0.5)/(1.8*mD),nY=(baseHeight*0.5-mSY)/(1.8*mD);
          let rdx=fX+rX*nX+uX*nY,rdy=fY+rY*nX+uY*nY,rdz=fZ+rZ*nX+uZ*nY;
          const rl=Math.sqrt(rdx*rdx+rdy*rdy+rdz*rdz);
          rdx/=rl;rdy/=rl;rdz/=rl;
          const pp=[];
          for(let i=0;i<5;i++){
            const b=0x070+i*12;
            const px=dv.getFloat32(b,true),py=dv.getFloat32(b+4,true),pz=dv.getFloat32(b+8,true);
            const d=Math.sqrt((cpx-px)**2+(cpy-py)**2+(cpz-pz)**2);
            const hr=Math.max(planetData[i].radius*1.5,25*d/(1.8*mD));
            pp.push({x:px,y:py,z:pz,hr:hr});
          }
          let px=cpx,py=cpy,pz=cpz,vx=rdx,vy=rdy,vz=rdz;
          const Lx=py*vz-pz*vy,Ly=pz*vx-px*vz,Lz=px*vy-py*vx;
          const L2=Lx*Lx+Ly*Ly+Lz*Lz;
          function accel(px,py,pz,vx,vy,vz){
            const r2=px*px+py*py+pz*pz,r=Math.sqrt(r2),r3=r2*r,r5=r2*r3;
            const f=-1.5*L2/r5;
            let ax=f*px,ay=f*py,az=f*pz;
            if(Math.abs(sp)>=0.001){
              const Jy=sp,rdot=(Jy*py)/r;
              const ox=(2*(-6*rdot*(px/r)))/r3;
              const oy=(2*(Jy-6*rdot*(py/r)))/r3;
              const oz=(2*(-6*rdot*(pz/r)))/r3;
              ax+=2*(oy*vz-oz*vy);ay+=2*(oz*vx-ox*vz);az+=2*(ox*vy-oy*vx);
            }
            return [ax,ay,az];
          }
          // Mirror of stepSize() in the fragment shader — keep the two in step, or the ray you
          // can click drifts away from the ray you can see. Curvature-adaptive: |acc| scales as
          // 1.5*L2/r^4, so dt = EPS/|acc| holds the per-step deflection constant instead of
          // over-resolving the far field. Also cuts this main-thread trace to a few dozen steps.
          const stepSize=r=>{const r2=r*r;
            let dt=Math.min(0.04*r2*r2/(1.5*L2+1.0),0.25*(r-rH));
            if(r<20)dt=Math.min(dt,0.08*(r-rH));
            return Math.max(0.002,Math.min(dt,40));};
          let r=Math.sqrt(px*px+py*py+pz*pz);
          let dt0=stepSize(r);
          let [ax0,ay0,az0]=accel(px,py,pz,vx,vy,vz);
          let vhx=vx+0.5*dt0*ax0,vhy=vy+0.5*dt0*ay0,vhz=vz+0.5*dt0*az0;
          const escR=Math.max(100,Math.sqrt(cpx*cpx+cpy*cpy+cpz*cpz)+20);
          let bestI=-1;
          for(let step=0;step<250;step++){
            if(r<rH*1.05)break;
            if(r>escR)break;
            if(r>100&&(px*vx+py*vy+pz*vz)>0)break;
            const dt=stepSize(r);
            const ppx=px,ppy=py,ppz=pz;
            px+=vhx*dt;py+=vhy*dt;pz+=vhz*dt;
            const [ax,ay,az]=accel(px,py,pz,vhx,vhy,vhz);
            vx=vhx+0.5*dt*ax;vy=vhy+0.5*dt*ay;vz=vhz+0.5*dt*az;
            vhx+=dt*ax;vhy+=dt*ay;vhz+=dt*az;
            const rNew=Math.sqrt(px*px+py*py+pz*pz);
            // Segment radial span, not just its start — a long step can cross the planet band
            // entirely, and gating on the start radius would skip the test for it.
            if(Math.max(r,rNew)>16&&Math.min(r,rNew)<100){
              const sx=px-ppx,sy=py-ppy,sz=pz-ppz;
              const sL2=sx*sx+sy*sy+sz*sz;
              for(let i=0;i<pp.length;i++){
                const p=pp[i];
                const ocx=ppx-p.x,ocy=ppy-p.y,ocz=ppz-p.z;
                const bH=ocx*sx+ocy*sy+ocz*sz;
                const tC=Math.max(0,Math.min(-bH/sL2,1));
                const cx=ocx+sx*tC,cy=ocy+sy*tC,cz=ocz+sz*tC;
                const d2=cx*cx+cy*cy+cz*cz;
                if(d2<p.hr*p.hr){bestI=i;break;}
              }
              if(bestI>=0)break;
            }
            r=rNew;
          }
          hP=bestI;
        }
        if(!dr)canvas.style.cursor=hP>=0?'pointer':'grab';
        else canvas.style.cursor='grabbing';
      }
      // --- Pass 1: render the scene into the low-res offscreen target ---
      gl.bindFramebuffer(gl.FRAMEBUFFER,sceneFBO);
      gl.viewport(0,0,lowW,lowH);
      gl.uniform2f(uR,lowW,lowH);          // raymarch frames against its actual (low-res) grid
      gl.uniform1f(uT,simTime);
      gl.uniform1f(uCD,camDist);
      gl.uniform1f(uSp,sp);
      gl.uniform3f(uCP,dv.getFloat32(0x030,true),dv.getFloat32(0x034,true),dv.getFloat32(0x038,true));
      gl.uniform3f(uCF,dv.getFloat32(0x03C,true),dv.getFloat32(0x040,true),dv.getFloat32(0x044,true));
      gl.uniform3f(uCR,dv.getFloat32(0x048,true),dv.getFloat32(0x04C,true),dv.getFloat32(0x050,true));
      gl.uniform3f(uCU,dv.getFloat32(0x054,true),dv.getFloat32(0x058,true),dv.getFloat32(0x05C,true));
      gl.uniform1f(uRH,dv.getFloat32(0x060,true));
      gl.uniform1f(uRI,dv.getFloat32(0x064,true));
      gl.uniform1f(uHP,hP);
      for(let i=0;i<5;i++){const b=0x070+i*12,o=i*4;planetBuf[o]=dv.getFloat32(b,true);planetBuf[o+1]=dv.getFloat32(b+4,true);planetBuf[o+2]=dv.getFloat32(b+8,true);planetBuf[o+3]=planetData[i].radius}
      gl.uniform4fv(uPls,planetBuf);
      gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
      // --- Pass 2: FXAA resolve the low-res scene up to the full-res canvas ---
      gl.bindFramebuffer(gl.FRAMEBUFFER,null);
      gl.viewport(0,0,canvas.width,canvas.height);
      gl.useProgram(fxaaPg);
      gl.uniform2f(uFxInv,1.0/lowW,1.0/lowH);
      gl.bindBuffer(gl.ARRAY_BUFFER,bf);
      gl.enableVertexAttribArray(fxaaAPos);
      gl.vertexAttribPointer(fxaaAPos,2,gl.FLOAT,false,0,0);
      gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
      // Restore raymarch program + quad attribute for next frame's pass 1.
      gl.useProgram(pg);
      gl.bindBuffer(gl.ARRAY_BUFFER,bf);
      gl.enableVertexAttribArray(aP);
      gl.vertexAttribPointer(aP,2,gl.FLOAT,false,0,0);
      {
        for(let i=0;i<5;i++){const b=0x0B8+i*12,sx=dv.getFloat32(b,true),sy=dv.getFloat32(b+4,true),dp=dv.getFloat32(b+8,true),lb=pL[i];
          if(dp>0&&sx>-100&&sx<baseWidth+100&&sy>-100&&sy<baseHeight+100){const ar=(planetData[i].radius/dp)*Math.min(baseWidth,baseHeight)*1.8;lb.style.transform='translate(calc('+sx+'px - 50%),'+(sy-ar-12)+'px)';lb.classList.add('visible')}else{lb.classList.remove('visible')}
          if(i===hP)lb.classList.add('hovered');else lb.classList.remove('hovered');
        }
      }
      fC++;if(now-lFT>=500){const fps=fC/(now-lFT)*1000;hF.textContent=Math.round(fps);hS.textContent=sp.toFixed(3);hD.textContent=camDist.toFixed(1)+' M';hSc.textContent=renderScale<0.99?Math.round(renderScale*100)+'% RES':'';fC=0;lFT=now}
      requestAnimationFrame(render);
    }
   </script>
 </body>
